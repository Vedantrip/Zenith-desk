<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenith Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <!-- Transparent Widget Layout -->
  <div class="widget-panel" id="widget-container">
    
    <!-- Header: Date and Time -->
    <header class="widget-header">
      <div class="clock-row">
        <span class="digital-clock" id="clock-display">00:00:00</span>
        <span class="ampm" id="clock-ampm">AM</span>
      </div>
      <div class="date-row">
        <span class="day-text" id="date-day">Saturday</span> &bull; 
        <span class="date-text" id="date-display">June 6, 2026</span>
      </div>
    </header>

    <div class="divider"></div>

    <!-- Active Focus Space State -->
    <section class="widget-section" id="section-focus-timer">
      <div class="section-title">
        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>FOCUS STATUS</span>
      </div>
      <div class="timer-card-widget">
        <div class="widget-timer-clock" id="widget-timer-text">ZEN SPACE READY</div>
        <div class="widget-timer-progress-bg">
          <div class="widget-timer-progress-fill" id="widget-timer-bar" style="width: 0%;"></div>
        </div>
      </div>
    </section>

    <!-- Checklist / Daily Milestones -->
    <section class="widget-section" id="section-tasks">
      <div class="section-title">
        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke-width="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
        <span>DAILY MILESTONES</span>
      </div>
      <ul class="widget-task-list" id="widget-task-checklist">
        <!-- Javascript populated tasks -->
      </ul>
    </section>

    <!-- System performance summary -->
    <section class="widget-section" id="section-telemetry">
      <div class="section-title">
        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/></svg>
        <span>ZENITH OPTIMIZER INDEX</span>
      </div>
      <div class="telemetry-bar-row">
        <div class="telemetry-bar-item">
          <span class="bar-lbl">CPU</span>
          <div class="bar-bg"><div class="bar-fill" id="widget-cpu-bar" style="width: 12%;"></div></div>
          <span class="bar-val" id="widget-cpu-text">12%</span>
        </div>
        <div class="telemetry-bar-item">
          <span class="bar-lbl">RAM</span>
          <div class="bar-bg"><div class="bar-fill" id="widget-ram-bar" style="width: 45%;"></div></div>
          <span class="bar-val" id="widget-ram-text">45%</span>
        </div>
      </div>
    </section>

    <!-- Widget Footer / Control panel toggle instruction -->
    <footer class="widget-footer">
      <span class="footer-hint" id="clickthrough-status">Transparency Lock: Active</span>
      <span class="footer-credits">Zenith Desk Overlay</span>
    </footer>
  </div>

  <script src="widget.js"></script>
</body>
</html>
